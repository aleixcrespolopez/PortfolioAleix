<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Preview Videos</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    background:#000;
    width:100vw;
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;
  }

  .video-container{
    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;

    padding:20px;
  }

  video{
    width:32%;
    max-height:90vh;

    border-radius:12px;
    background:#111;
  }
</style>
</head>

<body>

<div class="video-container">

  <video controls preload="metadata">
    <source src="Proyecto2.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

  <video controls preload="metadata">
    <source src="Proyecto2_1.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

  <video controls preload="metadata">
    <source src="Proyecto2_2.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

</div>

</body>
</html>
